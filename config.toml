# yoyo-phi configuration
# Override provider and model without changing code.
# API key falls back to env vars: OPENROUTER_API_KEY, API_KEY, ANTHROPIC_API_KEY

[provider]
name    = "openrouter"
api_url = "https://openrouter.ai/api/v1"
# api_key = "sk-or-..."  # optional; env var preferred

[model]
default = "anthropic/claude-3.5-sonnet"
